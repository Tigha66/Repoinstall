server {
  listen 127.0.0.1:8090;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # text-back service (Node) runs on host 127.0.0.1:2789 (landing container uses network_mode: host)
  location = /api/book   { proxy_pass http://127.0.0.1:2789/book;      proxy_set_header Host $host; }
  location = /simulate   { proxy_pass http://127.0.0.1:2789/simulate;  proxy_set_header Host $host; }
  location = /qr         { proxy_pass http://127.0.0.1:2789/qr;        proxy_set_header Host $host; }
  location = /qr-status  { proxy_pass http://127.0.0.1:2789/qr-status; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
# NOTE: this file is bind-mounted as a single file into the `landing` container.
# After editing, run: docker restart landing  (sed -i swaps the inode, so `nginx -s reload` alone won't pick it up)
