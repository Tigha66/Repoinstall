<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingBack — 10 mini-handouts per page</title>
<style>
@page{size:A4 portrait;margin:6mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0b141a;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.cell{height:53mm;border:1px dashed #bbb;border-radius:8px;padding:3.5mm 4mm;display:flex;gap:3.5mm;align-items:center;page-break-inside:avoid;overflow:hidden}
.q img{width:33mm;height:33mm;display:block}
.q .s{font-size:8px;text-align:center;color:#667781;margin-top:1mm;font-weight:700}
.tx{flex:1;min-width:0}
.brand{font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px}
.brand .d{width:9px;height:9px;border-radius:50%;background:#25d366}
.h{font-weight:800;font-size:13px;line-height:1.12;margin:2px 0}
.p{font-size:9px;color:#445;line-height:1.3}
.trial{display:inline-block;background:#e7f9ee;color:#1da851;font-weight:800;font-size:9px;padding:2px 7px;border-radius:999px;margin:3px 0}
.c{font-size:8px;color:#667781;line-height:1.3}
.c b{color:#0b141a}
@media screen{body{background:#eee;padding:14px}.grid{max-width:210mm;margin:0 auto;background:#fff;padding:6mm}}
@media print{.note{display:none}}
</style></head>
<body>
<p class="note" style="max-width:210mm;margin:0 auto 10px;font-size:13px;color:#444">Press <b>Ctrl/Cmd+P → Print / Save as PDF</b>. <b>10 handouts per A4</b> — cut along the dashed boxes. Each QR opens your demo + one-pager. Print a few sheets for a day of walking.</p>
<div class="grid" id="grid"></div>
<script>
var QR='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fget.callpilotvoice.co.uk%2Fonepager.html';
var cell='<div class="cell">'+
 '<div class="q"><img src="'+QR+'"><div class="s">📲 Scan: demo<br>+ free trial</div></div>'+
 '<div class="tx">'+
   '<div class="brand"><span class="d"></span>RingBack</div>'+
   '<div class="h">Never miss a customer\\'s call.</div>'+
   '<div class="p">Missed a call? The caller instantly gets a WhatsApp from your business — even after hours. They reply, you book them.</div>'+
   '<div class="trial">🎁 Free 7-day trial — no card</div>'+
   '<div class="c"><b>Abdelhak · CallPilot Voice</b><br>hello@callpilotvoice.co.uk<br>get.callpilotvoice.co.uk</div>'+
 '</div></div>';
document.getElementById('grid').innerHTML=cell.repeat(10);
</script>
</body></html>
