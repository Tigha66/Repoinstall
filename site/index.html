<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repoinstall</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 70% -10%, #1e293b, #0b1120);
      color: #e2e8f0;
    }
    .card {
      max-width: 640px;
      padding: 3rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #38bdf8;
      border: 1px solid #1e3a5f;
      border-radius: 999px;
      padding: .35rem .8rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 1rem;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { font-size: 1.1rem; line-height: 1.6; color: #94a3b8; margin: 0 auto; }
    .foot { margin-top: 2rem; font-size: .85rem; color: #475569; }
    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Live on here.now</span>
    <h1>It's deployed 🎉</h1>
    <p>Your site is hosted on <a href="https://here.now">here.now</a> and serving over HTTPS. Replace this placeholder with your real content whenever you're ready.</p>
    <p class="foot">Deployed on 2026-06-08</p>
  </main>
</body>
</html>
