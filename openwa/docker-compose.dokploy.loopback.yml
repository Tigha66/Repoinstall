services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwa-api:latest
    container_name: openwa-api
    restart: unless-stopped
    env_file:
      - .env.production
    shm_size: '1gb'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      - openwa-data:/app/data
    networks:
      - dokploy-network
    labels:
      traefik.enable: "false"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openwa-router:
    image: alpine:3.20
    container_name: openwa-router
    network_mode: host
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.openwa.rule: "Host(`api.76-13-252-4.sslip.io`) && PathPrefix(`/api`)"
      traefik.http.routers.openwa.entrypoints: "websecure"
      traefik.http.routers.openwa.tls.certresolver: "letsencrypt"
      traefik.http.routers.openwa.service: "openwa"
      traefik.http.services.openwa.loadbalancer.server.port: "2785"

volumes:
  openwa-data:
    driver: local

networks:
  dokploy-network:
    external: true
